
name: Build Android

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "UCI version/date (YYYYMMDD)"
        required: true
        default: "20261124"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Download Network
        run: |
          set -euo pipefail

          DEFAULT_NET=$(tr -d '\r\n' < network.txt)

          if [ -z "$DEFAULT_NET" ]; then
            echo "::error::network.txt is empty"
            exit 1
          fi

          echo "Downloading network: $DEFAULT_NET"

          curl --fail --location --retry 3 \
            --output hobbes.nnue \
            "https://github.com/kelseyde/hobbes-networks/releases/download/${DEFAULT_NET}/${DEFAULT_NET}.nnue"

          test -s hobbes.nnue
          ls -lh hobbes.nnue

      - name: Set UCI Version
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["UCI_DATE"]

          if not re.fullmatch(r"\d{8}", version):
              raise SystemExit(
                  f"Invalid uci_date: {version!r}. Expected YYYYMMDD."
              )

          # Match Rust VERSION constants regardless of their current value
          # or whether they use &str / &'static str.
          pattern = re.compile(
              r'(?m)^(\s*(?:pub(?:\([^)]*\))?\s+)?const\s+VERSION\s*:\s*&(?:\'static\s+)?str\s*=\s*)"[^"]*"(\s*;)'
          )

          matches = []

          for path in Path(".").rglob("*.rs"):
              if any(part in {
                  "target", ".git"
              } for part in path.parts):
                  continue

              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              for match in pattern.finditer(content):
                  matches.append((path, content, match))

          if not matches:
              print("Could not locate a Rust VERSION string constant.")
              print("Available VERSION declarations:")

              for path in Path(".").rglob("*.rs"):
                  if "target" in path.parts or ".git" in path.parts:
                      continue
                  try:
                      for line_no, line in enumerate(
                          path.read_text(encoding="utf-8").splitlines(), 1
                      ):
                          if "VERSION" in line:
                              print(f"{path}:{line_no}: {line.strip()}")
                  except (UnicodeDecodeError, OSError):
                      pass

              raise SystemExit(1)

          if len(matches) != 1:
              print("Found multiple VERSION constants:")
              for path, _, match in matches:
                  print(f"{path}: {match.group(0).strip()}")
              raise SystemExit(
                  "Refusing to patch an ambiguous VERSION constant."
              )

          path, content, match = matches[0]
          old_line = match.group(0)
          new_line = match.group(1) + f'"{version}"' + match.group(2)

          updated = (
              content[:match.start()]
              + new_line
              + content[match.end():]
          )

          path.write_text(updated, encoding="utf-8")

          print(f"Updated Rust UCI version in {path}")
          print(f"Old: {old_line.strip()}")
          print(f"New: {new_line.strip()}")
          PY

      - name: Build for Android
        run: |
          set -euo pipefail

          cargo ndk \
            -t arm64-v8a \
            --platform 24 \
            build --release \
            -p hobbes-chess-engine

          mkdir -p dist/bin

          cp target/aarch64-linux-android/release/hobbes-chess-engine \
             dist/bin/hobbes

          test -s dist/bin/hobbes

      - name: Verify Binary
        run: |
          set -euo pipefail

          echo "Android ARM64 artifact:"
          ls -lh dist/bin/

          file dist/bin/hobbes

          readelf -h dist/bin/hobbes

          if ! readelf -h dist/bin/hobbes | grep -q "AArch64"; then
            echo "::error::Binary is not AArch64"
            exit 1
          fi

          if readelf -d dist/bin/hobbes | grep -q "libc++_shared.so"; then
            echo "::warning::Binary depends on libc++_shared.so"
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hobbes-android-arm64
          path: dist/bin/hobbes
          if-no-files-found: error
