name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Download Network
        run: |
          # Replicate the download-net target from the Makefile
          DEFAULT_NET=$(cat network.txt | tr -d '\r\n')
          echo "Downloading network $DEFAULT_NET..."
          curl -L -o hobbes.nnue "https://github.com/kelseyde/hobbes-networks/releases/download/${DEFAULT_NET}/${DEFAULT_NET}.nnue"

      - name: Build for Android
        run: |
          # cargo-ndk handles the C-linker and sysroot automatically for Android
          # -t arm64-v8a is the standard 64-bit Android target
          # -p 24 sets the minimum API level to Android 7.0
          cargo ndk -t arm64-v8a -p 24 build --release -p hobbes-chess-engine
          
          mkdir -p dist/bin
          cp target/aarch64-linux-android/release/hobbes-chess-engine dist/bin/hobbes

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hobbes-android-arm64
          path: dist/bin/*
