name: Build Android

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "UCI version/date (e.g. 20260918)"
        required: true
        default: "20260918"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Download Network
        run: |
          DEFAULT_NET=$(cat network.txt | tr -d '\r\n')
          echo "Downloading network $DEFAULT_NET..."
          curl -L -o hobbes.nnue "https://github.com/kelseyde/hobbes-networks/releases/download/${DEFAULT_NET}/${DEFAULT_NET}.nnue"

      - name: Set UCI Version
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["UCI_DATE"]
          found = False

          for path in Path(".").rglob("*.rs"):
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue

              old = 'pub const VERSION: &str = "3.0";'
              if old in text:
                  new = f'pub const VERSION: &str = "{version}";'
                  path.write_text(text.replace(old, new, 1))
                  print(f"Patched version in {path}: {version}")
                  found = True
                  break

          if not found:
              raise SystemExit('Could not find: pub const VERSION: &str = "3.0";')
          PY

      - name: Build for Android
        run: |
          # Changed -p 24 to --platform 24 to avoid conflicting with cargo's --package flag
          cargo ndk -t arm64-v8a --platform 24 build --release -p hobbes-chess-engine
          
          mkdir -p dist/bin
          cp target/aarch64-linux-android/release/hobbes-chess-engine dist/bin/hobbes

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hobbes-android-arm64
          path: dist/bin/*
